name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install the wheel in a clean venv and import it
        run: |
          uv venv /tmp/smoke --python 3.11
          uv pip install --python /tmp/smoke dist/*.whl "langchain>=1.4"
          /tmp/smoke/bin/python -c "from langchain_nace import NaceClassifier, Noul; from langchain_nace.experimental.middleware import NaceAutoModeMiddleware, NaceModelRouterMiddleware"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
