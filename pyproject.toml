[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-nace"
description = "LangChain integration for Drex decision models by Nace"
keywords = ["langchain", "langgraph", "drex", "nace", "decision-model", "classifier", "router", "guardrails", "middleware"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dynamic = ["version"]
authors = [{ name = "Nace AI", email = "hello@nace.ai" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "nace-sdk>=0.3.0,<1.0.0",
    "langchain-core>=1.6.13,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.11,<3.0.0",
]

[project.optional-dependencies]
experimental = ["langchain>=1.4.0,<2.0.0"]

[project.urls]
Homepage = "https://console.nace.ai/docs"
Repository = "https://github.com/nace-ai/langchain-nace"
Issues = "https://github.com/nace-ai/langchain-nace/issues"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "langchain>=1.4.0,<2.0.0",
    "langgraph>=1.2.12",
    "pillow>=11.0",
    "langchain-anthropic>=1.0",
    "langchain-fireworks>=1.0",
]
lint = ["ruff>=0.14", "mypy>=1.18"]

[tool.hatch.version]
path = "langchain_nace/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_nace"]

[tool.hatch.build.targets.sdist]
include = ["langchain_nace", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Drex API (needs NACE_API_KEY_LIVE)", "compile: collect integration tests without calling Drex"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["langchain_nace"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "SIM", "PT", "TC", "ANN", "D"]
ignore = ["D203", "D213", "D401", "D105", "D107", "ANN401", "S101", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "PT011"]
"examples/**" = ["D", "S", "T201"]
"scripts/**" = ["D", "S", "T201"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["langchain_nace"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nace_sdk.*"]
follow_imports = "normal"
